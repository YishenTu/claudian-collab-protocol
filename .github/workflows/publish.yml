name: Publish reviewed npm release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node and public registry
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Pin npm
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Verify reviewed tag identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected_tag"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main

      - name: Verify package and exact release candidate
        run: npm run verify

      - name: Publish the verified tarball with provenance
        run: npm publish .context/release/claudian-collab-protocol-2.0.0.tgz --access public --provenance
